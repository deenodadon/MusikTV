name: Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test portable catalog
        run: |
          python -m pip install -r tests/requirements.txt
          python -m pytest -q
          node tests/plugin-host.test.mjs
      - name: Build, test and lint Android
        run: ./gradlew --no-daemon assembleRelease testReleaseUnitTest lintRelease assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: musik-tv-optimized
          path: app/build/outputs/apk/release/app-release.apk
